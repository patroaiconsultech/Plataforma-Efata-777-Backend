[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orkio-v2-premium-backend"
version = "2.0.0a1"
description = "ORKIO v2 Premium secure modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "cryptography>=50.0.0,<51",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5.0,<7",
  "reportlab>=4.0,<6",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "email-validator>=2.2,<3",
  "defusedxml>=0.7.1,<1",
  "boto3>=1.35,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1"]
stt = ["faster-whisper==1.2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"orkio_v2.agents" = ["*.json"]
